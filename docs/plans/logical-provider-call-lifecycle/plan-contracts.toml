[[contracts]]
title = "Provider invocation is the wire-request boundary"
statement = """
Each provider invocation performs at most one provider wire request and yields \
exactly one provider invocation evidence record. Provider clients, transports, \
and adapters perform no automatic call retry; every additional wire request \
requires another invocation visible to the logical provider call."""
rationale = """
Invocation cardinality and evidence cannot be audited when retries occur below \
the invocation boundary. Making every wire request explicit gives one stable \
unit for classification, retry decisions, and diagnostics."""
date = "2026-08-08"

[[contracts]]
title = "Logical results preserve exact invocation history"
statement = """
A logical provider call applies one provider call retry policy to one provider \
call request and returns a closed serializable result with ordered provider \
invocation evidence and corresponding dispositions in execution order and \
exactly one terminal disposition. Cancellation and interruption preserve every \
completed invocation, and policy exhaustion is explicit rather than inferred \
from the final invocation."""
rationale = """
The result must explain both what happened and why the call stopped. Ordered \
complete evidence prevents terminal outcomes from erasing earlier provider \
effects or retry decisions."""
date = "2026-08-08"

[[contracts]]
title = "Retry behavior is bounded, declared, and reproducible"
statement = """
A provider call retry policy has stable identity, a finite maximum invocation \
count, explicit retry eligibility, and declared delay-selection rules. \
Logical-call evidence records selected policy delay, applicable server-\
provided delay, and deterministic jitter inputs and result; incidental wall-\
clock time does not participate in provider-call request identity."""
rationale = """
Bounded declared policy makes repetition reviewable before execution, while \
recorded delay choices explain observed behavior without turning runtime \
scheduling into call meaning."""
date = "2026-08-08"

[[contracts]]
title = "Provider-call dispositions are closed and provider-generic"
statement = """
Provider invocation and terminal dispositions form closed serializable models \
that distinguish success, blank response, malformed response, semantic \
rejection, transient provider or network failure, rate limiting, timeout, \
cancellation or interruption, and exhausted policy without encoding \
application evaluation decisions."""
rationale = """
One exhaustive provider-level vocabulary makes retry and terminal behavior \
consistent across callers. Keeping evaluation meaning out of the taxonomy \
prevents research policy from becoming infrastructure contract."""
date = "2026-08-08"

[[contracts]]
title = "Semantic classification stops before evaluation policy"
statement = """
A semantic response classifier maps a provider transport response to a closed \
provider invocation disposition and serializable classification evidence. It \
does not assign task correctness, reward, candidate rank, task selection, or \
statistical meaning."""
rationale = """
Provider-call execution needs a generic decision about whether a response is \
usable or retryable, while only the consuming application can interpret that \
response within an evaluation."""
date = "2026-08-08"

[[contracts]]
title = "Logical-call identity is layered and credential-free"
statement = """
A logical provider call result binds the provider call request identity, \
provider call retry-policy identity, and lifecycle schema and implementation \
versions. API key values, authorization headers, raw secret configuration, \
wall-clock timing, and runtime scheduling state do not participate. Persisted \
identity keys and disposition discriminators are pinned by golden tests."""
rationale = """
Stable identities must distinguish changes in call meaning and retry behavior \
without persisting credentials or allowing incidental runtime conditions to \
change identity."""
date = "2026-08-08"

[[contracts]]
title = "Provider lifecycle ownership excludes workflow and evaluation"
statement = """
dr-providers owns provider-invocation classification, retry decisions, and \
terminal provider-call evidence. It does not own durable scheduling or \
timers, fan-out or fan-in, run membership, global admission or adaptive rate \
control, result caching, artifact storage, or evaluation decisions; callers \
may drive waiting or resumption without redefining provider retry semantics."""
rationale = """
Keeping the boundary at one logical provider call makes the lifecycle reusable \
inside local and durable execution systems without importing workflow or \
research policy into the provider package."""
date = "2026-08-08"

[[contracts]]
title = "Retries do not imply exactly-once provider effects"
statement = """
Every provider wire request may independently reach the external provider. A \
logical provider call reports its observable invocations and wire-request \
evidence but does not claim exactly-once external effects, global rate control, \
or termination of in-\
flight provider work after a timeout, cancellation, or interruption."""
rationale = """
Evidence can establish the invocations and wire requests observed by this \
package, not the provider's internal effects or containment that the transport \
cannot prove."""
date = "2026-08-08"
