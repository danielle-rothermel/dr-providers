[[contracts]]
title = "Provider invocation is the wire-request boundary"
statement = """
Each provider invocation makes at most one provider wire request and returns \
one provider invocation evidence record with any provider transport outcome. \
dr-providers retries only by starting another visible invocation; protocol \
retransmission and provider-side behavior are outside this contract."""
rationale = """
Hidden retries make invocation counts and evidence unauditable. Invalid inputs \
and unexpected defects remain exceptions."""
date = "2026-08-08"

[[contracts]]
title = "Returned call results preserve invocation history"
statement = """
A provider call result stores one ordered record per completed invocation, \
binding its evidence, outcome, and any retry decision and delay. Cooperative \
cancellation preserves every completed record. If requested during an in-flight \
invocation, the executor lets that invocation return under its normal timeout, \
records any returned evidence and outcome, makes the returned call outcome \
cooperative cancellation, and starts no further invocation. Policy exhaustion \
is explicit."""
rationale = """
The result explains what happened and why the call stopped without promising \
persistence across interruption."""
date = "2026-08-08"

[[contracts]]
title = "Retries are bounded, declared, and observable"
statement = """
A provider call retry policy is the sole retryability authority. It has stable \
identity, a positive finite invocation limit, explicit outcome eligibility, and \
delay rules. The result records each selected delay and source. The standard \
policy retries transient provider or network failure, rate limiting, and \
timeout. Blank response, malformed response, and semantic rejection require \
explicit policy; all other outcomes are terminal under the standard policy. \
Wall-clock time is excluded from provider call identity."""
rationale = """
One declared policy prevents transport evidence and retry behavior from \
disagreeing while keeping selected retries auditable."""
date = "2026-08-08"

[[contracts]]
title = "Invocation and call outcomes are closed and evaluation-neutral"
statement = """
Closed serializable invocation outcomes are success, blank response, malformed \
response, provider rejection, semantic rejection, permanent provider or \
transport failure, transient provider or network failure, rate limiting, \
resource exhaustion, timeout, or unknown transport failure. A valid accepted \
response is success; absent generation text is blank; invalid provider protocol \
or payload structure is malformed; explicit provider refusal is provider \
rejection; and caller rejection of a valid response is semantic rejection. \
Closed call outcomes are accepted invocation outcome, an invocation outcome for \
which policy stops, cooperative cancellation, or policy exhaustion. Neither \
model encodes evaluation decisions."""
rationale = """
Separate exhaustive vocabularies make retry behavior consistent without \
importing evaluation policy."""
date = "2026-08-08"

[[contracts]]
title = "Semantic classification excludes evaluation policy"
statement = """
A semantic response classifier returns success or semantic rejection for a \
valid provider transport response. Its opaque stable identifier is supplied by \
the caller, which owns keeping that identifier aligned with classifier \
behavior. The classifier assigns no correctness, reward, rank, task-selection, \
or statistical meaning."""
rationale = """
Provider execution needs usability and retryability decisions; applications \
own evaluation meaning."""
date = "2026-08-08"

[[contracts]]
title = "Call and result identities serve different purposes"
statement = """
Provider call identity binds request and retry-policy identities, the opaque \
classifier identifier, and provider-call schema version. Provider call result \
identity is the content identity of the complete serialized result. Package, \
dependency, runtime, and duration diagnostics may affect result identity but \
not provider call identity. Standard construction excludes declared credentials \
from both identities but does not promise detection of undeclared secrets. \
Golden tests pin persisted keys and outcome discriminators."""
rationale = """
The call identity groups executions with the same declared semantics while the \
result identity identifies one complete observation."""
date = "2026-08-08"

[[contracts]]
title = "Provider lifecycle ownership excludes workflow and evaluation"
statement = """
dr-providers owns invocation outcomes, retry decisions, and terminal call \
evidence, including synchronous waiting between invocations. It exposes no \
resumable next-invocation state. It excludes workflow orchestration (durable \
scheduling, timers, fan-out, fan-in, and run membership), global admission or \
adaptive rate control, result caching, artifact storage, and evaluation \
decisions."""
rationale = """
The one-call boundary works in local and durable systems without importing \
workflow or research policy."""
date = "2026-08-08"

[[contracts]]
title = "Retries do not imply exactly-once provider effects"
statement = """
Each provider wire request may independently reach the provider. A call result \
reports observed invocations and wire evidence but guarantees neither exactly-\
once effects, global rate control, nor termination of in-flight work after a \
timeout, cooperative cancellation, or process interruption."""
rationale = """
Evidence proves only what this package observed, not provider effects or \
transport containment."""
date = "2026-08-08"
