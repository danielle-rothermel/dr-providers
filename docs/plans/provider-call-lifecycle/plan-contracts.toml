[[contracts]]
title = "Provider invocation is the wire-request boundary"
statement = """
Each provider invocation makes at most one provider wire request and returns \
one provider invocation evidence record with any provider transport outcome. \
dr-providers retries only by starting another visible invocation; protocol \
retransmission and provider-side behavior are outside this contract."""
rationale = """
Hidden retries make invocation counts and evidence unauditable. Invalid inputs \
and unexpected defects remain exceptions."""
date = "2026-08-08"

[[contracts]]
title = "Returned call results preserve invocation history"
statement = """
A returned provider call result preserves invocation evidence and outcomes in \
order. Cooperative cancellation includes every invocation completed before it \
was observed. Policy exhaustion is explicit."""
rationale = """
The result explains what happened and why the call stopped without promising \
persistence across interruption."""
date = "2026-08-08"

[[contracts]]
title = "Retries are bounded, declared, and observable"
statement = """
A provider call retry policy has stable identity, a finite invocation limit, \
explicit retry eligibility, and delay rules. The result records each selected \
delay and source. Wall-clock time is excluded from request identity."""
rationale = """
Selected delays make retries auditable without standardizing delay computation \
or scheduling."""
date = "2026-08-08"

[[contracts]]
title = "Invocation and call outcomes are closed and evaluation-neutral"
statement = """
Closed serializable invocation outcomes are success, blank response, malformed \
response, semantic rejection, transient provider or network failure, rate \
limiting, or timeout. Closed serializable call outcomes are an accepted or non-\
retryable invocation outcome, cooperative cancellation, or policy exhaustion. \
Neither model encodes evaluation decisions."""
rationale = """
Separate exhaustive vocabularies make retry behavior consistent without \
importing evaluation policy."""
date = "2026-08-08"

[[contracts]]
title = "Semantic classification excludes evaluation policy"
statement = """
A semantic response classifier returns only a provider invocation outcome. It \
assigns no correctness, reward, rank, task-selection, or statistical meaning."""
rationale = """
Provider execution needs usability and retryability decisions; applications \
own evaluation meaning."""
date = "2026-08-08"

[[contracts]]
title = "Call-result identity binds declared semantics"
statement = """
Provider call-result identity binds request, retry-policy, and classifier \
identities plus the result schema version. Package, dependency, and runtime \
versions are diagnostics only. Standard construction excludes declared \
credentials but does not promise detection of undeclared secrets. Golden tests \
pin persisted keys and outcome discriminators."""
rationale = """
This captures call semantics without making releases or runtime state identity-\
affecting or promising arbitrary secret discovery."""
date = "2026-08-08"

[[contracts]]
title = "Provider lifecycle ownership excludes workflow and evaluation"
statement = """
dr-providers owns invocation outcomes, retry decisions, and terminal call \
evidence. It excludes workflow orchestration (durable scheduling, timers, fan-\
out, fan-in, and run membership), global admission or adaptive rate control, \
result caching, artifact storage, and evaluation decisions. Callers may drive \
waiting or resumption without redefining retry semantics."""
rationale = """
The one-call boundary works in local and durable systems without importing \
workflow or research policy."""
date = "2026-08-08"

[[contracts]]
title = "Retries do not imply exactly-once provider effects"
statement = """
Each provider wire request may independently reach the provider. A call result \
reports observed invocations and wire evidence but guarantees neither exactly-\
once effects, global rate control, nor termination of in-flight work after a \
timeout, cooperative cancellation, or process interruption."""
rationale = """
Evidence proves only what this package observed, not provider effects or \
transport containment."""
date = "2026-08-08"
