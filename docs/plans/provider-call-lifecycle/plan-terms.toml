#:schema ../../../.defs/terms.schema.json

[[terms]]
name = "provider wire request"
definition = """
An outbound protocol request to a provider service."""
part_of = ["provider invocation"]

[[terms]]
name = "provider invocation"
definition = """
One execution of a provider call request that makes at most one provider wire \
request and returns one provider invocation evidence record with any provider \
transport outcome."""
part_of = ["provider call"]

[[terms]]
name = "provider call"
definition = """
Application of one provider call retry policy and semantic response classifier \
to an ordered sequence of provider invocations for one provider call request, \
producing one provider call result."""

[[terms]]
name = "provider call identity"
definition = """
The stable identity of a provider call's declared semantics, binding its \
request, retry policy, classifier identifier, and schema version."""
part_of = ["provider call result"]

[[terms]]
name = "provider call retry policy"
definition = """
A frozen identity-bearing declaration of the finite invocation limit, provider \
invocation outcome eligibility, and delay rules."""
part_of = ["provider call"]

[[terms]]
name = "semantic response classifier"
definition = """
A caller-supplied mapping from a provider transport response to a provider \
invocation outcome, identified by an opaque stable identifier whose meaning the \
caller owns. It does not decide application correctness, reward, or experiment \
value."""

[[terms]]
name = "provider invocation outcome"
definition = """
The terminal transport or semantic classification of one provider invocation, \
used to decide whether the provider call stops or continues."""
part_of = ["provider call result"]

[[terms]]
name = "provider call outcome"
definition = """
The terminal classification of one provider call: an accepted invocation \
outcome, an invocation outcome for which policy stops, cooperative cancellation, \
or retry-policy exhaustion."""
part_of = ["provider call result"]

[[terms]]
name = "provider call result"
definition = """
The complete versioned serializable return value: provider call identity; \
ordered per-invocation associations of evidence, outcomes, and retry decisions; \
and one provider call outcome."""
