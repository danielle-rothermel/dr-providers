[project]
name = "dr-providers"
version = "0.3.5"
description = "Typed LLM provider-call kernel with HTTP providers, local HuggingFace generation and scoring, identity-bearing configs, and expected failures as values."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "llm",
    "openai",
    "anthropic",
    "openrouter",
    "gemini",
    "provider",
    "transport",
    "pydantic",
    "typed",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "dr-serialize>=0.1.2,<0.2",
    "dr-wire>=0.1.0,<0.2",
    "pydantic>=2.14.0,<3",
]

[project.optional-dependencies]
cli = ["typer>=0.27.3"]
local = [
    "huggingface-hub>=1.33.0,<3",
    "torch>=2.14.1,<3",
    "transformers>=5.19.0,<6",
]
local-cuda = [
    "accelerate>=1.15.0,<2 ; sys_platform == 'linux'",
    "bitsandbytes>=0.50.2 ; sys_platform == 'linux'",
    "huggingface-hub>=1.33.0,<3",
    "torch>=2.14.1,<3",
    "transformers>=5.19.0,<6",
]

[project.scripts]
dr-providers = "dr_providers.surfaces.cli.entry:main"

[project.urls]
Repository = "https://github.com/danielle-rothermel/dr-providers"
Issues = "https://github.com/danielle-rothermel/dr-providers/issues"
Documentation = "https://danielle-rothermel.github.io/dr-providers/"
Changelog = "https://github.com/danielle-rothermel/dr-providers/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
    "typer>=0.27.3",
]

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live and not local_model'"
markers = [
    "live: hits real provider endpoints; requires API keys",
    "local_model: real local model execution; requires the local extra",
]

[tool.ruff]
include = ["scripts/**/*.py", "src/**/*.py", "tests/**/*.py"]
line-length = 79

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T10",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = ["PLR1711", "S101", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "PLC0415"]

[tool.ty.src]
include = ["scripts", "src", "tests"]
exclude = ["src/dr_providers/local/transformers.py", "tests/local/test_transformers.py"]

[tool.pyright]
venvPath = "."
venv = ".venv"
