[project]
name = "dr-providers"
version = "0.3.0"
description = "Typed LLM provider-call kernel for OpenAI, Anthropic, OpenRouter, and Gemini with identity-bearing configs and expected failures as values."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "llm",
    "openai",
    "anthropic",
    "openrouter",
    "gemini",
    "provider",
    "transport",
    "pydantic",
    "typed",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "dr-http>=0.1.0,<0.2",
    "dr-serialize>=0.1.2,<0.2",
    "pydantic>=2.13.4,<3",
]

[tool.uv.sources]
# Pinned to the head of dr-http PR #1 (bounded-client-core). Bump to the
# post-merge main sha when that PR merges, before this one does.
dr-http = { git = "https://github.com/danielle-rothermel/dr-http", rev = "1f9dfb8b706ec0a4080f86a867e410e9b9e6ed84" }

[project.optional-dependencies]
cli = ["typer>=0.26.7"]

[project.scripts]
dr-providers = "dr_providers.surfaces.cli.entry:main"

[project.urls]
Repository = "https://github.com/danielle-rothermel/dr-providers"
Issues = "https://github.com/danielle-rothermel/dr-providers/issues"
Documentation = "https://danielle-rothermel.github.io/dr-providers/"
Changelog = "https://github.com/danielle-rothermel/dr-providers/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "ty>=0.0.51",
    "typer>=0.26.7",
]

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live'"
markers = [
    "live: hits real provider endpoints; requires API keys",
]

[tool.ruff]
include = ["scripts/**/*.py", "src/**/*.py", "tests/**/*.py"]
line-length = 79

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T10",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = ["PLR1711", "S101", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "PLC0415"]

[tool.ty.src]
include = ["scripts", "src", "tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
