[project]
name = "dr-providers"
version = "0.2.0"
description = "Typed LLM provider-call kernel for OpenRouter, OpenAI, and Gemini: one request, response, and failure vocabulary across providers."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "dr-serialize>=0.1.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
cli = ["typer>=0.26.7"]
serve = [
    "fastapi>=0.121",
    "typer>=0.26.7",
    "uvicorn>=0.35",
]

[project.urls]
Repository = "https://github.com/danielle-rothermel/dr-providers"
Issues = "https://github.com/danielle-rothermel/dr-providers/issues"

# TEMPORARY: editable path deps for cross-repo integration testing.
# do-not-merge-as-is. Original PyPI source (restore before merge):
#   dr-serialize is published to PyPI; drop this [tool.uv.sources] block.
[tool.uv.sources]
dr-serialize = { path = "../dr-serialize", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "ty>=0.0.51",
    "typer>=0.26.7",
]

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits real provider endpoints; requires API keys",
]

[tool.ruff]
include = ["scripts/**/*.py", "src/**/*.py", "tests/**/*.py"]
line-length = 79

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T10",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = ["PLR1711", "S101", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "PLC0415"]

[tool.ty.src]
include = ["scripts", "src", "tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
