#:schema ./terms.schema.json

[[terms]]
name = "definition"
definition = """
A versioned declaration of fixed structure, variable slots, constraints, and \
identity effects."""

[[terms]]
name = "variable"
definition = """
A named slot whose accepted values and identity effect are declared by one \
definition."""
part_of = ["definition"]

[[terms]]
name = "config"
definition = """
A complete validated assignment of the variables belonging to one \
definition."""

[[terms]]
name = "hash"
definition = """
A deterministic fixed-length value computed by a declared algorithm over \
exact input bytes."""

[[terms]]
name = "identity payload"
definition = """
Strict finite-JSON domain facts deliberately selected to determine identity, \
excluding incidental runtime and transport state."""
part_of = ["identity document"]

[[terms]]
name = "identity document"
definition = """
A self-describing versioned document containing a schema name, schema \
version, and identity payload."""

[[terms]]
name = "canonical identity JSON text"
definition = """
The deterministic UTF-8 JSON rendering of a validated identity document, \
produced without lossy normalization."""

[[terms]]
name = "identity hash"
definition = """
The full 64-character lowercase SHA-256 hash of canonical identity JSON \
text."""
is_a = ["hash"]

[[terms]]
name = "provider model"
definition = """
A requested model identifier scoped to one provider service."""
part_of = ["model route"]

[[terms]]
name = "provider service"
definition = """
A model-serving family: OpenRouter, OpenAI, Gemini, and Anthropic expose \
HTTP protocols; HuggingFace names local execution through transformers."""
part_of = ["model route"]

[[terms]]
name = "provider transcript"
definition = """
An ordered sequence of role-and-content messages supplied as generation \
input."""
exported_symbols = ["Transcript", "PromptMessage", "MessageRole"]
part_of = ["provider call request"]

[[terms]]
name = "provider"
definition = """
An executor of provider invocations for provider call requests."""
exported_symbols = ["Provider"]

[[terms]]
name = "HTTP provider"
definition = """
A provider that translates and executes real HTTP calls under a transport \
policy."""
exported_symbols = ["HttpProvider"]
is_a = ["provider"]

[[terms]]
name = "offloading provider"
definition = """
A provider that also runs caller work on its own executor. The HTTP provider \
sizes that executor from the transport policy's connection limit and drains it \
before the provider closes; the scripted provider owns a single ungated worker, \
because it models provider responses rather than the wire client's bounds."""
exported_symbols = ["OffloadingProvider"]
is_a = ["provider"]

[[terms]]
name = "scripted provider"
definition = """
A deterministic network-free provider that consumes scripted outcomes in \
order and repeats the last available outcome. It offloads as well as invokes, \
so the shipped testing surface drives the asynchronous entry point without a \
local wrapper."""
exported_symbols = ["ScriptedProvider", "ScriptedOutcome"]
is_a = ["provider"]

[[terms]]
name = "model route"
definition = """
The declared provider-service, protocol, and model tuple for a provider \
call. HuggingFace admits only transformers; its model is a verbatim Hub repo \
ID or local path. Declaration does not guarantee an available executor."""
exported_symbols = ["ModelRoute", "ProviderKind", "Protocol"]
part_of = ["provider call definition"]

[[terms]]
name = "provider quota identity"
definition = """
A route-granularity quota identity equal to the exact provider, protocol, \
and model tuple. It carries no quota meaning for local routes."""
exported_symbols = ["ProviderQuotaIdentity"]

[[terms]]
name = "provider call definition"
definition = """
A variable-bearing definition declaring a model route, supported call kinds, \
supported and required controls, control mappings, HTTP extension keys, and \
identity effects. A local model spec is required exactly for HuggingFace; \
local definitions refuse HTTP extension keys. PromptRendering selects \
role-preserving messages or separator-free flat text. A local backend uses \
the tokenizer chat template for role messages; HTTP carries flat text as one \
user message. Scoring requires empty required controls and ignores rendering; \
capability declarations do not guarantee executor support."""
exported_symbols = [
  "ProviderCallDefinition",
  "PromptRendering",
  "PROVIDER_CALL_DEFINITION_SCHEMA",
  "PROVIDER_CALL_DEFINITION_SCHEMA_VERSION",
  "ControlConstraints",
  "RequestControl",
  "TokenLimitParameter",
  "ReasoningRequestShape",
]
is_a = ["definition"]
part_of = ["provider call config"]

[[terms]]
name = "provider call config"
definition = """
A complete validated assignment of one provider call definition's controls \
and provider body extensions."""
exported_symbols = [
  "ProviderCallConfig",
  "PROVIDER_CALL_CONFIG_SCHEMA",
  "PROVIDER_CALL_CONFIG_SCHEMA_VERSION",
  "GenerationControls",
  "ReasoningEffort",
  "Verbosity",
  "ProviderBodyExtensions",
  "anthropic_messages_config",
  "gemini_chat_config",
  "huggingface_config",
  "openai_chat_config",
  "openai_responses_config",
  "openrouter_chat_config",
]
is_a = ["config"]
part_of = ["provider call request"]

[[terms]]
name = "provider call request"
definition = """
The discriminated union of provider generate and provider score requests, \
each carrying a call kind and one provider call config."""
exported_symbols = [
  "ProviderCallRequest",
]

[[terms]]
name = "provider transport policy"
definition = """
An identity-bearing declaration binding one HTTP provider service to its credentials \
location, endpoint, native connect, write/pool, and response-read idle timeouts, \
connection-pool limits, and request and response byte limits. The connect and \
idle timeouts are clamped down to the general timeout at construction, before \
identity is taken, so the policy records the effective bound rather than the \
caller's declaration and two different declarations can share one identity. It \
is excluded from provider-call request identity."""
exported_symbols = [
  "ProviderTransportPolicy",
  "ApiKeyEnv",
  "ProviderBaseUrl",
  "DEFAULT_API_KEY_ENVS",
  "DEFAULT_BASE_URLS",
  "policy_for",
]

[[terms]]
name = "provider transport response"
definition = """
A typed transport success containing extracted text, a decoded response \
mapping, usage, cost, warnings, typed stop reason, optional OpenAI-protocol \
system fingerprint, and diagnostics without asserting semantic acceptance \
or byte fidelity."""
exported_symbols = [
  "ProviderTransportResponse",
  "ProviderStopReason",
  "TokenUsage",
  "CostInfo",
  "ResponsesDiagnostics",
  "parse_response",
  "parse_anthropic_messages_body",
  "parse_chat_completions_body",
  "parse_responses_body",
  "token_usage_from_body",
  "cost_from_body",
]
is_a = ["provider transport outcome"]
part_of = ["provider invocation evidence"]

[[terms]]
name = "provider transport failure"
definition = """
A typed expected transport or protocol failure containing recoverability \
classification, an unbudgeted summary message, optional wire-path exception \
traceback, optional decoded response evidence, status, typed timeout \
containment, and diagnostics. It does not own provider HTTP request evidence."""
exported_symbols = [
  "ProviderTransportFailure",
  "TransportTimeoutContainment",
  "classify_status_code",
]
is_a = ["provider transport outcome"]
part_of = ["provider invocation evidence"]

[[terms]]
name = "recoverability class"
definition = """
The closed recoverability classification for a provider transport failure or \
raised validation failure record. Values are permanent, transient, \
rate-limited, resource exhaustion, or unknown. This is distinct from \
platform attribution channels also named failure_class elsewhere."""
exported_symbols = ["RecoverabilityClass"]
part_of = ["provider transport failure", "provider failure record"]

[[terms]]
name = "provider transport outcome"
definition = """
The closed generate-response, score-response, or failure observation retained \
by one provider invocation, before invocation and call classification."""
exported_symbols = ["ProviderTransportOutcome", "is_response", "is_score_response", "is_failure"]

[[terms]]
name = "provider failure record"
definition = """
A compact classification record carried consistently by its raised provider \
error, with recoverability on the record."""
exported_symbols = [
  "ProviderFailure",
  "ControlValidationError",
  "ProviderFailureError",
  "failure_record",
]

[[terms]]
name = "provider transport warning"
definition = """
An advisory post-response observation whose fatality belongs to the caller. Conformance checks cover reasoning not observed, model substitution, and a local definition revision that is not a full commit SHA."""
exported_symbols = [
  "ProviderTransportWarning",
  "WarningSeverity",
  "conformance_warnings",
  "with_conformance_warnings",
]
part_of = ["provider transport response"]

[[terms]]
name = "provider HTTP request evidence"
definition = """
The retained method, URL, headers, constructed body, and exact encoded body size \
for one provider wire request. Redaction of known credential header names is a \
step in ``build()``, not a type invariant: direct construction and \
deserialization retain whatever headers they are given, so evidence restored \
from a third party is not re-redacted."""
exported_symbols = [
  "ProviderHttpRequestEvidence",
  "SANITIZE_KEYS",
  "sanitize_headers",
  "sanitize_kwargs",
]
part_of = ["provider invocation evidence"]

[[terms]]
name = "provider invocation evidence"
definition = """
A versioned serializable record binding request identity, optional transport-\
policy identity and provider HTTP request evidence, optional byte accounting \
and normalized rate-limit hint, the request kind, and exactly one generate response, score response, or \
failure. Local execution evidence is mutually exclusive with policy identity \
and HTTP request evidence. Wall time is persisted but excluded from identity. \
HTTP evidence is bounded by its declared transport policy."""
exported_symbols = [
  "ProviderInvocationEvidence",
  "ProviderRetryAfterHint",
  "PROVIDER_INVOCATION_EVIDENCE_SCHEMA",
  "PROVIDER_INVOCATION_EVIDENCE_SCHEMA_VERSION",
]

[[terms]]
name = "provider wire request"
definition = """
An outbound protocol request to a provider service."""
part_of = ["provider invocation"]

[[terms]]
name = "provider invocation"
definition = """
One execution of a provider call request that makes at most one provider wire \
request and produces one provider invocation evidence record."""
part_of = ["provider call"]

[[terms]]
name = "provider call"
definition = """
Application of one provider call retry policy and semantic response classifier \
to an ordered sequence of provider invocations for one provider call request, \
producing one provider call result."""

[[terms]]
name = "provider call identity"
definition = """
The stable identity of a provider call's declared semantics, binding its \
request, retry policy, classifier identifier, and schema version."""
exported_symbols = [
  "PROVIDER_CALL_SCHEMA",
  "PROVIDER_CALL_SCHEMA_VERSION",
  "provider_call_identity_document",
  "provider_call_hash",
]
part_of = ["provider call result"]

[[terms]]
name = "provider call retry policy"
definition = """
A frozen identity-bearing declaration of how many invocations one provider call \
may make, in one of two closed shapes. The standard policy declares only its \
type and a fixed limit of one invocation: it names no eligible outcomes and no \
delays, so it never retries. The custom policy declares a finite invocation \
limit, the eligible provider invocation outcomes, one finite nonnegative delay \
between each permitted invocation, and the finite maximum cumulative delay \
those delays sum to."""
exported_symbols = [
  "PROVIDER_CALL_RETRY_POLICY_SCHEMA",
  "PROVIDER_CALL_RETRY_POLICY_SCHEMA_VERSION",
  "CustomProviderCallRetryPolicy",
  "ProviderCallRetryPolicy",
  "StandardProviderCallRetryPolicy",
]
part_of = ["provider call"]

[[terms]]
name = "semantic response classifier"
definition = """
A caller-supplied mapping from a valid provider transport response to success \
or semantic rejection, identified by an opaque stable identifier whose meaning \
the caller owns. It assigns no evaluation meaning."""
exported_symbols = [
  "ACCEPT_ALL_SEMANTIC_CLASSIFIER_IDENTIFIER",
  "AcceptAllSemanticResponseClassifier",
  "SemanticResponseClassifier",
  "SemanticResponseClassifierIdentifier",
  "classify_semantic_response",
]
part_of = ["provider call"]

[[terms]]
name = "provider invocation outcome"
definition = """
The closed transport, protocol, or semantic classification of one provider \
invocation, used to decide whether its provider call stops or continues."""
exported_symbols = [
  "ProviderInvocationOutcome",
  "classify_provider_invocation",
]
part_of = ["provider call result"]

[[terms]]
name = "contained transport timeout"
definition = """
A provider invocation outcome in which a native transport timeout ends the \
local HTTP operation before the outcome is observed."""
is_a = ["provider invocation outcome"]

[[terms]]
name = "uncontained deadline expiration"
definition = """
A provider invocation outcome for evidence that does not establish local \
termination of the associated operation."""
is_a = ["provider invocation outcome"]

[[terms]]
name = "never sent"
definition = """
A provider invocation outcome for a request the process never dispatched, \
because the configured endpoint does not form a dispatchable http or https \
URL. It carries no HTTP request evidence and reaches no provider."""
is_a = ["provider invocation outcome"]

[[terms]]
name = "provider call state"
definition = """
The closed versioned serializable state needed to validate and continue one \
provider call between provider invocations."""
exported_symbols = [
  "PROVIDER_CALL_STATE_SCHEMA_VERSION",
  "ProviderCallState",
]
part_of = ["provider call"]

[[terms]]
name = "completed provider invocation observation"
definition = """
One completed provider invocation's ordinal, request reference, evidence \
reference, and evidence-consistent provider invocation outcome before a retry \
decision. Failure evidence fixes the outcome exactly; only a valid nonblank \
response leaves success versus semantic rejection to the selected classifier."""
exported_symbols = [
  "COMPLETED_INVOCATION_OBSERVATION_SCHEMA",
  "COMPLETED_INVOCATION_OBSERVATION_SCHEMA_VERSION",
  "CompletedProviderInvocationObservation",
]
part_of = ["decided provider invocation record"]

[[terms]]
name = "decided provider invocation record"
definition = """
A completed provider invocation observation bound to its selected retry \
decision, when another invocation is permitted."""
exported_symbols = [
  "DECIDED_INVOCATION_RECORD_SCHEMA",
  "DECIDED_INVOCATION_RECORD_SCHEMA_VERSION",
  "DecidedProviderInvocationRecord",
]
part_of = ["provider call state", "provider call result"]

[[terms]]
name = "provider call transition"
definition = """
A deterministic advancement from provider call state and a completed \
invocation observation to a provider retry instruction or provider call \
result."""
exported_symbols = ["transition_provider_call"]

[[terms]]
name = "provider retry instruction"
definition = """
The nonterminal output of a provider call transition, declaring the selected \
delay, next invocation ordinal, and next provider call state."""
exported_symbols = [
  "PROVIDER_RETRY_INSTRUCTION_SCHEMA_VERSION",
  "ProviderRetryDecision",
  "ProviderRetryDelaySource",
  "ProviderRetryInstruction",
]

[[terms]]
name = "provider retry wait"
definition = """
A local execution boundary that waits for a provider retry instruction's \
declared delay in platform-bounded chunks and observes cancellation."""
exported_symbols = ["EventProviderRetryWait", "ProviderRetryWait"]

[[terms]]
name = "draining cancellation"
definition = """
Cooperative cancellation that starts no successor and retains any completed \
active invocation observation. It does not promise prompt release of remote \
resources."""
exported_symbols = ["cancel_provider_call"]
is_a = ["provider call outcome"]

[[terms]]
name = "provider call outcome"
definition = """
The closed terminal classification of one provider call: acceptance, a \
policy-terminal invocation outcome, draining cancellation, or retry-policy \
exhaustion."""
exported_symbols = ["ProviderCallOutcome", "ProviderCallOutcomeKind"]
part_of = ["provider call result"]

[[terms]]
name = "provider call result"
definition = """
The complete versioned serializable terminal value containing provider call \
identity, ordered decided invocation records, and one provider call outcome."""
exported_symbols = [
  "PROVIDER_CALL_RESULT_SCHEMA",
  "PROVIDER_CALL_RESULT_SCHEMA_VERSION",
  "ProviderCallResult",
]

[[terms]]
name = "local provider call driver"
definition = """
A synchronous executor that performs provider invocations and follows provider \
call transition outputs until cancellation or a terminal result."""
exported_symbols = ["run_local_provider_call"]

[[terms]]
name = "offloaded provider call entry"
definition = """
An awaitable entry point that runs one local provider call driver on an \
offloading provider's executor and awaits its result."""
exported_symbols = ["run_local_provider_call_async"]

[[terms]]
name = "provider call kind"
definition = """
The closed generate-or-score classification that a definition declares and a \
request carries."""
exported_symbols = ["ProviderCallKind"]
part_of = ["provider call definition", "provider call request"]

[[terms]]
name = "provider generate request"
definition = """
An identity-bearing generate request containing a config and ordered transcript; \
its identity covers the generate kind, config hash, and transcript."""
exported_symbols = [
  "ProviderGenerateRequest",
  "PROVIDER_GENERATE_REQUEST_SCHEMA",
  "PROVIDER_GENERATE_REQUEST_SCHEMA_VERSION",
  "build_payload",
  "protocol_path",
]
is_a = ["provider call request"]

[[terms]]
name = "provider score request"
definition = """
An identity-bearing score request containing a config, exact context string, \
nonempty ordered continuation strings, and a flag requiring per-token log \
probabilities. Empty context and duplicate continuations are allowed; controls \
and body extensions must be unset. Every input field bears identity."""
exported_symbols = [
  "ProviderScoreRequest",
  "PROVIDER_SCORE_REQUEST_SCHEMA",
  "PROVIDER_SCORE_REQUEST_SCHEMA_VERSION",
]
is_a = ["provider call request"]

[[terms]]
name = "provider score response"
definition = """
An ordered nonempty sequence of continuation scores with optional usage, cost, \
warnings, and model. It classifies as success without semantic classification. \
The evidence build path checks score count, character counts, and required \
per-token detail against the request; restoration is trusted."""
exported_symbols = ["ProviderScoreResponse"]
is_a = ["provider transport outcome"]
part_of = ["provider invocation evidence"]

[[terms]]
name = "continuation score"
definition = """
The finite nonpositive total natural-log likelihood of continuation tokens \
conditioned on context, their positive token count, the original continuation \
character count, and optional finite nonpositive per-token log probabilities \
in token order. Context tokens are excluded; tokenization is backend-owned. \
Every field bears evidence identity."""
exported_symbols = ["ContinuationScore"]
part_of = ["provider score response"]

[[terms]]
name = "local model spec"
definition = """
The identity-bearing declared conditions for a locally loaded model: \
revision, device, dtype, float32 matmul precision, quantization, batch size, \
maximum sequence length, continuation tokenization, and add_bos_token. \
Callers should pass a full 40-character lowercase hex commit SHA as revision \
so declared identity matches the resolved snapshot; other selectors are \
accepted with a conformance warning. Revision selectors and local paths do \
not guarantee immutable model contents. Non-highest \
matmul precision and quantization require CUDA; supported hardware remains \
backend-validated. Continuation tokenization is lm_eval_encode_pair: move \
trailing context whitespace to the continuation, encode context and the whole \
pair without automatic special tokens, and slice whole IDs at context length. \
Empty-after-rstrip context uses a BOS prefix, falling back to EOS; zero-token \
pairs are refused. add_bos_token defaults to false in the preset; true ensures \
a leading tokenizer BOS on generation prompts and scoring context without \
duplicating a leading BOS or adding one to continuation targets."""
exported_symbols = [
  "LocalModelSpec",
  "is_commit_sha",
  "LocalDevice",
  "LocalDtype",
  "Float32MatmulPrecision",
  "Quantization",
  "ContinuationTokenization",
]
part_of = ["provider call definition"]

[[terms]]
name = "local execution evidence"
definition = """
Selected realized local execution conditions: device and name, dtype, matmul \
precision, quantization, resolved Hub revision when available, torch and \
transformers versions, chat-template application, and configured BOS policy. \
The explicit empty-context scoring prefix is independent of that policy; \
scoring records no chat-template use. Every field bears identity; the record is not a complete environment fingerprint."""
exported_symbols = ["LocalExecutionEvidence"]
part_of = ["provider invocation evidence"]

[[terms]]
name = "local usage convention"
definition = """
Local generation records input tokens as prompt_tokens, generated tokens as \
completion_tokens, and their sum as total_tokens. Local scoring records summed unpadded forward-input lengths as prompt_tokens \
and total_tokens: repeated context and any prefix count per row, the final \
target token and padding do not. completion_tokens remains unset. Local responses declare \
CostInfo(total_cost=0.0), meaning zero provider charge, rather than absent \
cost."""

[[terms]]
name = "local model provider"
definition = """
A provider binding one HuggingFace definition to one loaded backend, translating \
expected invocation failures into evidence and serializing direct model work, \
cache release, and offloaded invocations. Shutdown stops new admission, drains \
admitted work, then releases the backend."""
exported_symbols = ["LocalModelProvider"]
is_a = ["provider", "offloading provider"]

[[terms]]
name = "local backend"
definition = """
The torch-free behavioral boundary owning rendering, tokenization, model work, \
and execution-condition discovery. TransformersBackend loads a causal LM; \
FakeLocalBackend scripts results without runtime dependencies. GenerationOutput \
contains generated text and usage; ScoredContinuation contains continuation \
likelihood, token count, optional detail, and unpadded forward-input count. \
LocalBackendFailure carries one fixed local failure code and recoverability."""
exported_symbols = [
  "LocalBackend",
  "TransformersBackend",
  "FakeLocalBackend",
  "LocalBackendFailure",
  "GenerationOutput",
  "ScoredContinuation",
]
