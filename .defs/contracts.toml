[[contracts]]
title = "Provider-call identity is layered by reference"
statement = """
Definition identity covers its identifier, route, constraints, required \
controls, and extension keys; config identity references the full definition \
hash and adds assigned controls and extensions; request identity references \
the full config hash and adds the ordered transcript. Transport policy is \
absent from all three identities."""
rationale = """
Layered references keep each identity boundary explicit without duplicating \
upstream state. Full hashes make every dependency visible while transport-\
only choices remain free to vary without changing call meaning."""
date = "2026-08-05"
check = "uv run pytest -q tests/modeling/test_identity.py tests/modeling/test_serialization.py"

[[contracts]]
title = "Call assignments are validated before identity and wire encoding"
statement = """
Controls reject coercive and non-finite values; provider body extensions are \
strict finite JSON, deeply isolated, declared by the definition, and unable \
to replace core wire fields. Every advertised control has a usable wire \
mapping. Missing required controls and unmappable values for supported \
controls always fail; unsupported controls fail unless unsupported-control \
dropping is explicitly enabled."""
rationale = """
Identity and wire encoding must consume the same validated meaning. Allowing \
coercion, mutable aliases, undeclared extensions, or core-field replacement \
would let an apparently identical config produce a different request."""
date = "2026-08-05"
check = "uv run pytest -q tests/modeling/test_call.py tests/translation/test_request.py"

[[contracts]]
title = "Quota identity is route-only"
statement = """
Provider quota identity is exactly the provider, protocol, and model tuple; \
credentials, accounts, endpoint overrides, controls, and transport policy \
never participate."""
rationale = """
Quota accounting groups calls by executable route. Credential- or policy-\
specific identity would fragment one route into pools the package cannot \
prove correspond to distinct provider quotas."""
date = "2026-08-05"
check = "uv run pytest -q tests/modeling/test_call.py::TestConfigPresets::test_openrouter_chat"

[[contracts]]
title = "Provider invocation is the wire-request boundary"
statement = """
Each provider invocation makes at most one provider wire request and produces \
one provider invocation evidence record containing exactly one provider \
transport response or expected failure. Retries occur only as distinct visible \
invocations. Invalid caller-supplied configuration and unexpected programming \
or infrastructure errors may raise."""
rationale = """
Visible invocation boundaries keep wire-request counts and evidence auditable \
while preserving exceptions for invalid input and defects."""
date = "2026-08-08"
check = "uv run pytest -q tests/core/test_provider.py tests/transport/test_http.py"

[[contracts]]
title = "Raised provider failures have one classification"
statement = """
A raised provider error's nominal class, carried failure-record class, and \
derived retryability cannot disagree. Direct construction with a mismatched \
record is rejected."""
rationale = """
Callers may branch on either the exception type or its structured record. A \
contradiction between those public signals would make recovery decisions \
depend on which representation a caller happened to inspect."""
date = "2026-08-05"
check = "uv run pytest -q tests/core/test_failures.py"

[[contracts]]
title = "One serializable state machine owns retry transitions"
statement = """
Provider call state is closed, versioned, and serializable. It validates call \
components, ordered invocation ordinals, completed-record hashes, and the next \
legal transition. Given current state and one completed invocation observation, \
the deterministic transition produces either a terminal provider call result or \
a provider retry instruction containing the selected delay, next ordinal, and \
next state. Serializing and restoring state between invocations preserves the \
terminal result."""
rationale = """
Local and durable drivers can consume one retry model without sharing execution, \
scheduling, or storage machinery."""
date = "2026-08-08"
check = "uv run pytest -q tests/lifecycle/test_reducer.py tests/lifecycle/test_handoff.py"

[[contracts]]
title = "Native transport timeouts are locally contained"
statement = """
Timeout values are strict positive finite policy values, and the response-read \
idle timeout is clamped to the general timeout. Each provider wire request runs \
directly under native connect, read, write, and pool timeouts. A native timeout \
is observed only after the local HTTP operation has ended and is classified as \
a contained transport timeout. Provider invocation starts no deadline worker or \
child process."""
rationale = """
Direct native execution preserves the reusable connection pool and makes the \
implemented timeout containment boundary explicit."""
date = "2026-08-08"
check = "uv run pytest -q tests/transport/test_policy.py tests/transport/test_timeout.py tests/lifecycle/test_classification.py"

[[contracts]]
title = "Invocation evidence is normalized and byte-bounded"
statement = """
Transport policy declares positive request and response byte limits that \
participate in policy identity and invocation evidence. The exact encoded \
request is counted before dispatch, and decompressed response bytes are streamed \
and counted before decoding. Over-limit outcomes retain bounded resource-\
exhaustion evidence and no partial body. Provider HTTP request evidence is the \
sole owner of the constructed request body; transport failures do not repeat \
it. Failure summaries are bounded and do not copy response bodies. The standard \
HTTP path redacts known credential headers, while direct construction and \
deserialization remain trusted inputs. Original wire bytes are not retained."""
rationale = """
Explicit bounds and ownership preserve truthful, self-contained evidence \
without retry-amplified request data or unbounded buffering."""
date = "2026-08-08"
check = "uv run pytest -q tests/outcomes/test_evidence.py tests/transport/test_bounds.py tests/lifecycle/test_handoff.py::test_two_invocation_result_does_not_amplify_large_evidence"

[[contracts]]
title = "Call results retain normalized complete invocation history"
statement = """
A self-contained provider call result stores the complete provider call request \
and retry policy once. Each ordered decided invocation record binds one embedded \
observation and its evidence to validated content hashes, refers to its request \
by hash, and retains any selected retry decision. The result contains one \
provider call outcome and does not add call-level usage or cost aggregates."""
rationale = """
The terminal value remains independently auditable without multiplying large \
immutable payloads across retries."""
date = "2026-08-08"
check = "uv run pytest -q tests/lifecycle/test_handoff.py tests/lifecycle/test_reducer.py"

[[contracts]]
title = "The standard retry policy is small and exact"
statement = """
The provider call retry policy is the sole retryability authority. The standard \
policy permits at most two invocations and one deterministic one-second delay, \
with one second of maximum cumulative delay in policy identity. It retries only \
contained transient provider or network failure and contained transport timeout. \
Rate limiting, uncontained deadline expiration, resource exhaustion, provider \
rejection, permanent failure, and unknown failure are terminal. Blank response, \
malformed response, and semantic rejection require an explicitly selected \
custom policy. A retained normalized Retry-After hint does not affect the \
standard policy."""
rationale = """
One explicit retry authority bounds request amplification while making broader \
caller-selected policies identifiable."""
date = "2026-08-08"
check = "uv run pytest -q tests/lifecycle/test_policy_and_outcomes.py tests/lifecycle/test_reducer.py tests/transport/test_bounds.py -k 'retry_after or standard_policy'"

[[contracts]]
title = "Invocation and call outcomes are closed and evaluation-neutral"
statement = """
Provider invocation outcomes form a closed transport, protocol, and semantic \
classification. Strict protocol classification precedes semantic classification. \
Provider call outcomes form a closed terminal classification of acceptance, a \
policy-terminal invocation outcome, draining cancellation, or policy exhaustion. \
Neither outcome model assigns application correctness, reward, rank, or \
statistical meaning."""
rationale = """
Exhaustive provider outcomes support deterministic lifecycle transitions without \
importing evaluation policy."""
date = "2026-08-08"
check = "uv run pytest -q tests/lifecycle/test_classification.py tests/lifecycle/test_policy_and_outcomes.py"

[[contracts]]
title = "Semantic classification excludes evaluation policy"
statement = """
A semantic response classifier receives a valid nonblank provider transport \
response and returns success or semantic rejection. Its opaque stable identifier \
is supplied by the caller, which owns keeping the identifier aligned with \
classifier behavior. The classifier assigns no application correctness, reward, \
rank, task-selection, or statistical meaning."""
rationale = """
Provider execution needs response acceptance while applications own evaluation \
meaning."""
date = "2026-08-08"
check = "uv run pytest -q tests/lifecycle/test_classification.py tests/lifecycle/test_policy_and_outcomes.py -k classifier"

[[contracts]]
title = "Call and result identities serve different purposes"
statement = """
Provider call identity binds request and retry-policy identities, the opaque \
classifier identifier, and provider-call schema version. Provider call result \
identity binds call-level fields, ordered decided-record hashes, and the terminal \
outcome. Embedded component hashes are validated. Package, dependency, runtime, \
and duration diagnostics may affect result identity but not provider call \
identity. Standard construction excludes declared credentials from identities \
without claiming detection of undeclared secrets."""
rationale = """
Compositional content identity separates declared call semantics from the \
complete terminal observation."""
date = "2026-08-08"
check = "uv run pytest -q tests/lifecycle/test_reducer.py tests/lifecycle/test_handoff.py"

[[contracts]]
title = "HttpProvider owns one bounded reusable client lifecycle"
statement = """
Each HttpProvider owns one long-lived synchronous HTTP client with explicit \
identity-bearing connection and keep-alive limits and reuses it across \
invocations. Closing stops admission, drains active invocations, closes the \
client exactly once, rejects new invocations, and leaves the provider terminal."""
rationale = """
One bounded owned lifecycle preserves pooling and makes shutdown and ownership \
auditable."""
date = "2026-08-08"
check = "uv run pytest -q tests/transport/test_http.py tests/transport/test_concurrency.py"

[[contracts]]
title = "Cancellation drains active invocation work"
statement = """
Draining cancellation interrupts retry waits through a cancellation event and \
starts no successor. It does not preempt an active synchronous invocation; any \
completed active invocation observation is retained before the call returns \
draining cancellation. The outcome promises neither overload shedding nor prompt \
release of remote provider capacity."""
rationale = """
Completed provider work remains attributable without treating cooperative \
cancellation as remote resource control."""
date = "2026-08-08"
check = "uv run pytest -q tests/lifecycle/test_driver.py tests/lifecycle/test_reducer.py -k cancellation"

[[contracts]]
title = "Lifecycle values are storage and workflow neutral"
statement = """
dr-providers owns provider invocation, evidence, outcomes, provider call state, \
retry transitions, and terminal results. Its lifecycle values are serializable \
without depending on a persistence engine or workflow runtime. External systems \
may persist state and schedule declared retry instructions but do not redefine \
retry eligibility. dr-providers makes no global-admission or workflow-membership \
claim."""
rationale = """
Stable lifecycle semantics can run locally or durably without coupling provider \
models to storage and orchestration machinery."""
date = "2026-08-08"
check = "uv run pytest -q tests/lifecycle/test_handoff.py tests/core/test_package_structure.py"

[[contracts]]
title = "Serializable retries do not imply exactly-once provider effects"
statement = """
Each provider wire request may independently reach the provider. A provider call \
result reports observed completed invocations but guarantees neither exactly-once \
provider effects nor atomicity between an external effect and persistence of the \
next state. Each completed invocation remains independently attributable."""
rationale = """
Serializable retry state supports handoff but cannot make an external provider \
effect atomic with state persistence."""
date = "2026-08-08"
check = "uv run pytest -q tests/lifecycle/test_handoff.py::test_serialized_two_invocation_handoff_matches_local_driver"

[[contracts]]
title = "Conformance warnings are advisory"
statement = """
Reasoning-not-observed, token-limit-exceeded, and model-substitution checks \
add warnings without reclassifying a successful transport response; callers \
decide fatality."""
rationale = """
The transport can report a mismatch against requested controls but does not \
own application acceptance policy. Reclassifying transport success would \
collapse those separate decisions."""
date = "2026-08-05"
check = "uv run pytest -q tests/outcomes/test_conformance.py"

[[contracts]]
title = "Only protocol-declared generation text is accepted"
statement = """
Translation reads text only from each protocol's declared message and content \
locations. The Responses path never treats function calls, reasoning items, \
future item content, or refusal text as generation text; failed, malformed, \
refusal-only, and no-text bodies become typed failures, while diagnostic \
categories are allowlisted or coalesced."""
rationale = """
Provider payloads mix generation with metadata and tool activity. Broad text \
scraping would silently turn non-generation fields into model output and make \
future schema additions change established behavior."""
date = "2026-08-05"
check = "uv run pytest -q tests/translation"

[[contracts]]
title = "The top-level package owns the stable API"
statement = """
dr_providers.__all__ is the supported import surface. Functional-area paths \
communicate ownership but are not a second compatibility surface; non-surface \
areas do not depend on surfaces, and importing the root or pure modules does \
not eagerly load HTTP transport dependencies."""
rationale = """
One explicit surface makes compatibility review mechanically checkable while \
the internal layout remains free to express responsibility boundaries. \
Treating every module path as public would freeze implementation structure."""
date = "2026-08-05"
check = "uv run pytest -q tests/core/test_public_api.py tests/core/test_package_structure.py"

[[contracts]]
title = "Live verification is read-only and corpus promotion is explicit"
statement = """
Ordinary live verification covers the fixed five-case matrix without writing \
the committed wire corpus. Capture stages outside the repository; promotion \
requires a complete valid capture, redacts configured credentials and known \
sensitive locations, and attempts to restore the prior complete generation \
from staged backups after an in-process installation failure. Process \
interruption or a rollback failure can leave a mixed generation."""
rationale = """
Verification must not rewrite reviewable fixtures as a side effect. Separate \
capture, validation, redaction, and promotion make corpus replacement a \
deliberate operation; the explicit restoration limit avoids presenting an \
in-process best-effort rollback as crash-atomic publication."""
date = "2026-08-05"
check = "uv run pytest -q tests/transport/live/test_workflow.py"

[[contracts]]
title = "Audit-corpus curation and generated outputs have separate owners"
statement = """
Raw audits, the manifest, and the canonical suggestion mapping are curated \
inputs. The generator validates but never overwrites the canonical mapping \
and deterministically owns only parsed audits and analysis outputs."""
rationale = """
Human judgment owns canonical suggestions, while deterministic transformation \
owns reproducible derived data. Mixing those owners would let regeneration \
silently replace curated ground truth."""
date = "2026-06-23"
check = "uv run pytest -q tests/data/test_audit_ground_truth.py"
